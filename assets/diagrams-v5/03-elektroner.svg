<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description" lang="sv" xml:lang="sv">
<title id="title">Laddning och elektroner</title><desc id="description">En neutral väteatom har en positiv proton och en negativ elektron. När elektronen lämnar blir det en positiv jon. Två väteatomer kan i stället dela på två elektroner.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#54E3C2"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-weight:500}line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="620" rx="20" fill="#091524"/><text x="600" y="72" font-size="44" fill="#F1F4EE" text-anchor="middle">Laddning och elektroner</text><rect x="20" y="120" width="370" height="470" rx="16" fill="#A7BBC8" fill-opacity=".025" stroke="#A7BBC8" stroke-opacity=".5" stroke-width="2"/><rect x="415" y="120" width="370" height="470" rx="16" fill="#A7BBC8" fill-opacity=".025" stroke="#A7BBC8" stroke-opacity=".5" stroke-width="2"/><rect x="810" y="120" width="370" height="470" rx="16" fill="#A7BBC8" fill-opacity=".025" stroke="#A7BBC8" stroke-opacity=".5" stroke-width="2"/><text x="205" y="175" font-size="36" fill="#F1F4EE" text-anchor="middle">Neutral atom</text><text x="600" y="175" font-size="36" fill="#F1F4EE" text-anchor="middle">Positiv jon</text><text x="995" y="175" font-size="34" fill="#F1F4EE" text-anchor="middle">Dela elektroner</text><circle cx="205" cy="310" r="85" fill="none" stroke="#A7BBC8" stroke-width="2"/><circle cx="205" cy="310" r="27" fill="#091524"/><circle cx="205" cy="310" r="27" fill="#F5C866" fill-opacity=".14" stroke="#F5C866" stroke-width="3"/><text x="205" y="319.72" font-size="31.86" fill="#F1F4EE" text-anchor="middle">+</text><circle cx="290" cy="310" r="20" fill="#091524"/><circle cx="290" cy="310" r="20" fill="#72B8FF" fill-opacity=".14" stroke="#72B8FF" stroke-width="3"/><text x="290" y="317.2" font-size="23.599999999999998" fill="#F1F4EE" text-anchor="middle">−</text><text x="205" y="490" font-size="28" fill="#F1F4EE" text-anchor="middle">lika många + och −</text><circle cx="580" cy="310" r="27" fill="#091524"/><circle cx="580" cy="310" r="27" fill="#F5C866" fill-opacity=".14" stroke="#F5C866" stroke-width="3"/><text x="580" y="319.72" font-size="31.86" fill="#F1F4EE" text-anchor="middle">+</text><path d="M623,305 L710,250" fill="none" stroke="#54E3C2" stroke-width="4" marker-end="url(#arrow)"/><circle cx="730" cy="240" r="20" fill="#091524"/><circle cx="730" cy="240" r="20" fill="#72B8FF" fill-opacity=".14" stroke="#72B8FF" stroke-width="3"/><text x="730" y="247.2" font-size="23.599999999999998" fill="#F1F4EE" text-anchor="middle">−</text><text x="600" y="490" font-size="28" fill="#72B8FF" text-anchor="middle">en elektron lämnar</text><ellipse cx="995" cy="310" rx="142" ry="80" fill="none" stroke="#A7BBC8" stroke-width="2"/><circle cx="920" cy="310" r="25" fill="#091524"/><circle cx="920" cy="310" r="25" fill="#F5C866" fill-opacity=".14" stroke="#F5C866" stroke-width="3"/><text x="920" y="319.0" font-size="29.5" fill="#F1F4EE" text-anchor="middle">+</text><circle cx="1070" cy="310" r="25" fill="#091524"/><circle cx="1070" cy="310" r="25" fill="#F5C866" fill-opacity=".14" stroke="#F5C866" stroke-width="3"/><text x="1070" y="319.0" font-size="29.5" fill="#F1F4EE" text-anchor="middle">+</text><circle cx="985" cy="285" r="13" fill="#091524"/><circle cx="985" cy="285" r="13" fill="#72B8FF" fill-opacity=".14" stroke="#72B8FF" stroke-width="3"/><text x="985" y="289.68" font-size="15.34" fill="#F1F4EE" text-anchor="middle">−</text><circle cx="1005" cy="335" r="13" fill="#091524"/><circle cx="1005" cy="335" r="13" fill="#72B8FF" fill-opacity=".14" stroke="#72B8FF" stroke-width="3"/><text x="1005" y="339.68" font-size="15.34" fill="#F1F4EE" text-anchor="middle">−</text><text x="995" y="465" font-size="28" fill="#F1F4EE" text-anchor="middle">två väteatomer</text><text x="995" y="515" font-size="25" fill="#72B8FF" text-anchor="middle">delar på två elektroner</text></svg>
