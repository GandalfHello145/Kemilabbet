<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description" lang="sv" xml:lang="sv">
<title id="title">Atom, molekyl och blandning</title><desc id="description">En syreatom visas som en röd cirkel med O. Två blå H-atomer och en röd O-atom sitter ihop i en vattenmolekyl. Vatten och syrgas tillsammans är en blandning av två ämnen.</desc>
