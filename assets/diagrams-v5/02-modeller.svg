<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description" lang="sv" xml:lang="sv">
<title id="title">Tre bilder av atomen</title><desc id="description">Thomsons modell visar elektroner inne i en positiv klump. Rutherfords modell har en liten kärna och mycket tomrum. Bohrs skalmodell visar en kärna med elektroner i skal.</desc>
