<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description" lang="sv" xml:lang="sv">
<title id="title">Samma vattenmolekyler i tre former</title><desc id="description">Fyra likadana vattenmolekyler visas i varje form. I is har de bestämda platser. I flytande vatten ligger de nära och kan röra sig förbi varandra. I gas finns större avstånd mellan dem. Molekylerna blir inte större.</desc>
