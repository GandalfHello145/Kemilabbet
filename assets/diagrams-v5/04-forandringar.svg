<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description" lang="sv" xml:lang="sv">
<title id="title">Smältning eller kemisk reaktion?</title><desc id="description">Vid smältning finns samma två vattenmolekyler kvar, men deras platser ändras. Vid reaktionen ordnas fyra väteatomer och två syreatomer om från väte och syre till två vattenmolekyler. Atomerna finns kvar.</desc>
